name: Récap de la semaine

on:
  schedule:
    - cron: '0 19 * * 0'
      timezone: 'Europe/Paris'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  hebdo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && pip install --upgrade edge-tts
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Récap hebdomadaire
        run: python weekly.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Garder le planning actif
        if: always()
        run: gh workflow enable hebdo.yml || true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
